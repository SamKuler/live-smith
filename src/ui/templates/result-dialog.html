<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#292929" />
    <title>Live Smith Result</title>
    <script>
      __HOST_ADAPTER_SCRIPT__
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #292929;
        --panel: #3a3a3a;
        --text: #f2f2f2;
        --muted: #b8b8b8;
        --line: #555;
        --accent: #8fd36a;
        --accent-text: #10220b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
        height: 100vh;
        padding: 14px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }

      pre {
        margin: 0;
        overflow: auto;
        overscroll-behavior: contain;
        white-space: pre-wrap;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 5px;
        padding: 10px;
        line-height: 1.45;
        color: var(--text);
        font-family: inherit;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }

      button {
        border: 0;
        border-radius: 5px;
        padding: 7px 12px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #a5df86;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>__TITLE__</h1>
      <pre>__BODY__</pre>
      <div class="actions">
        <button type="button" onclick="LiveSmithHostAdapter.closeWithResult({ closed: true })">Close</button>
      </div>
    </main>
  </body>
</html>
